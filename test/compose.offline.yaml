# Set SMOKE_VAULT_PATH to an empty temporary directory before running.
# docker compose -f test/compose.offline.yaml run --rm offline-check write
# docker compose -f test/compose.offline.yaml run --rm offline-check read
services:
  offline-check:
    image: pencils:local
    network_mode: none
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      VAULT_PATH: /data
    volumes:
      - "${SMOKE_VAULT_PATH:?Set SMOKE_VAULT_PATH to an empty temporary directory}:/data"
      - "./offline.mjs:/app/test/offline.mjs:ro"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["node", "/app/test/offline.mjs"]

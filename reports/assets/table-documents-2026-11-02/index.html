function icons(root=document){root.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));}
const data={Budget:{A1:'Item',B1:'Quantity',C1:'Unit cost',D1:'Total',E1:'Category',F1:'Notes',A2:'Discovery & planning',B2:'8',C2:'75',D2:'=B2*C2',E2:'Research',F2:'Two working sessions',A3:'Interface design',B3:'12',C3:'80',D3:'=B3*C3',E3:'Design',F3:'Desktop, iPad & phone',A4:'Development',B4:'24',C4:'95',D4:'=B4*C4',E4:'Build',F4:'Core features and integrations',A5:'Testing',B5:'8',C5:'75',D5:'=B5*C5',E5:'Quality',F5:'Cross-browser and touch checks',A6:'Hosting',B6:'1',C6:'120',D6:'=B6*C6',E6:'Running costs',F6:'Annual server costs',A8:'Project total',D8:'=SUM(D2:D6)',A10:'Buffer (15%)',B10:'0.15',D10:'=D8*B10',A11:'Total with buffer',D11:'=SUM(D8,D10)'},Assumptions:{A1:'Assumption',B1:'Value',C1:'Notes',A2:'Contingency',B2:'0.15',C2:'15% buffer',A3:'Working days / week',B3:'5',A4:'Currency',B4:'GBP',A5:'Planning horizon',B5:'Annual'}};
let sheet='Budget',selected='D4',editing=null,filter='',history=[],redo=[];const cols=Array.from({length:14},(_,i)=>String.fromCharCode(65+i));const formula=document.querySelector('#formula');
// Prototype calculations are intentionally limited to the sample's SUM, multiplication and cell references.
function value(address,seen=new Set()){if(seen.has(address))return '#CYCLE!';seen=new Set(seen).add(address);const raw=data[sheet][address]??'';if(!raw.startsWith('='))return raw!==''&&Number.isFinite(Number(raw))?Number(raw):raw;const expression=raw.slice(1).trim();if(/^SUM\([A-Z]+\d+(?::[A-Z]+\d+|,[A-Z]+\d+)*\)$/i.test(expression)){const args=expression.slice(4,-1);let cells=args.split(',');if(args.includes(':')){const [a,b]=args.split(':');cells=Array.from({length:Number(b.slice(1))-Number(a.slice(1))+1},(_,i)=>a[0]+(Number(a.slice(1))+i));}const values=cells.map(a=>value(a,seen));return values.some(v=>typeof v==='string'&&v.startsWith('#'))?'#VALUE!':values.reduce((a,b)=>a+(Number(b)||0),0);}if(/^[A-Z]+\d+\*[A-Z]+\d+$/i.test(expression)){const values=expression.split('*').map(a=>value(a,seen));return values.every(v=>typeof v==='number')?values[0]*values[1]:'#VALUE!';}if(/^[A-Z]+\d+$/.test(expression))return value(expression,seen);return '#FORMULA?';}
const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',minimumFractionDigits:2}).format(n);
function display(a){const v=value(a);return typeof v==='number'&&sheet==='Budget'&&['C','D'].includes(a[0])?money(v):v;}
function render(){document.querySelector('thead tr').innerHTML='<th aria-label="Select all"></th>'+cols.map(c=>`<th data-col="${c}" scope="col">${c}</th>`).join('');document.querySelector('tbody').innerHTML=Array.from({length:60},(_,i)=>{const row=i+1;return `<tr class="${row===1?'header-row':''}" ${filter&&row>=2&&row<=6&&data[sheet]['E'+row]!==filter?'hidden':''}><th scope="row">${row}</th>${cols.map(c=>{const a=c+row,v=value(a);return `<td tabindex="-1" data-cell="${a}" aria-label="${a}: ${esc(display(a))}" class="${typeof v==='number'?'numeric':''} ${['8','11'].includes(String(row))&&['A','B','C','D'].includes(c)&&sheet==='Budget'?'total':''} ${String(v).startsWith('#')?'error':''}">${esc(display(a))}</td>`;}).join('')}</tr>`;}).join('');select(selected);}
function select(a,focus=false){if(!document.querySelector(`[data-cell="${a}"]`))return;document.querySelectorAll('.selected,.selected-head').forEach(el=>el.classList.remove('selected','selected-head'));selected=a;const cell=document.querySelector(`[data-cell="${a}"]`);cell.classList.add('selected');cell.tabIndex=0;if(focus)cell.focus({preventScroll:true});document.querySelector(`[data-col="${a[0]}"]`).classList.add('selected-head');cell.parentElement.querySelector('th').classList.add('selected-head');document.querySelector('#cell-address').textContent=a;formula.value=data[sheet][a]??'';document.querySelector('#summary').innerHTML=typeof value(a)==='number'?`Sum <strong>${esc(display(a))}</strong>`:'Text cell';}
function set(a,raw){history.push({sheet,address:a,old:data[sheet][a]??'',next:raw});redo=[];data[sheet][a]=raw;render();}
function edit(cell){if(editing)return;editing=cell.dataset.cell;cell.contentEditable='true';cell.textContent=data[sheet][editing]??'';cell.focus();const range=document.createRange();range.selectNodeContents(cell);getSelection().removeAllRanges();getSelection().addRange(range);}
function finish(commit=true){if(!editing)return;const a=editing,cell=document.querySelector(`[data-cell="${a}"]`),raw=cell.textContent;editing=null;cell.contentEditable='false';if(commit)set(a,raw);else render();}
function hint(text){const el=document.querySelector('#hint');el.textContent=text;el.hidden=false;clearTimeout(hint.timer);hint.timer=setTimeout(()=>el.hidden=true,3200);}
function panel(anchor,html){const el=document.querySelector('#menu');if(!el.hidden&&panel.anchor===anchor){el.hidden=true;return;}el.innerHTML=html;icons(el);el.hidden=false;panel.anchor=anchor;const r=anchor.getBoundingClientRect(),width=el.offsetWidth;el.style.left=Math.max(8,Math.min(innerWidth-width-8,r.right-width))+'px';el.style.top=Math.min(r.bottom+5,innerHeight-el.offsetHeight-86)+'px';}
const item=(action,label,glyph)=>`<button type="button" data-action="${action}">${icon(glyph)}${label}</button>`;
document.addEventListener('click',event=>{const cell=event.target.closest('[data-cell]');if(cell&&!editing){if(matchMedia('(pointer:coarse)').matches&&cell.dataset.cell===selected)edit(cell);else select(cell.dataset.cell,true);return;}const button=event.target.closest('[data-action]');if(!button){if(!event.target.closest('#menu'))document.querySelector('#menu').hidden=true;return;}const action=button.dataset.action;if(action==='files'){document.querySelector('#files').hidden=false;document.querySelector('#backdrop').hidden=false;}else if(action==='close-files'){document.querySelector('#files').hidden=true;document.querySelector('#backdrop').hidden=true;}else if(action==='theme'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';}else if(action==='bold'||action==='italic'||action==='fill'){const cell=document.querySelector(`[data-cell="${selected}"]`);if(action==='bold')cell.classList.toggle('bold');if(action==='italic')cell.style.fontStyle=cell.style.fontStyle==='italic'?'normal':'italic';if(action==='fill')cell.classList.toggle('filled');}else if(action==='undo'||action==='redo'){finish(false);const source=action==='undo'?history:redo,target=action==='undo'?redo:history;const entry=source.pop();if(entry){data[entry.sheet][entry.address]=action==='undo'?entry.old:entry.next;target.push(entry);render();}else hint('No edits to '+action+' in this prototype.');}else if(action==='tools'){panel(button,item('files','Browse documents','documents')+item('rename','Rename table','edit')+'<hr>'+item('import','Import CSV','upload')+item('export','Export CSV','download')+'<hr>'+item('history','Version history','clock')+item('link','Copy link','link')+'<hr>'+item('prototype-note','Move to Trash','trash'));}else if(action==='new'){panel(button,item('new-note','Document','file')+item('add-sheet','Table','table')+'<small>Tables live in Documents alongside notes.</small>');}else if(action==='format'){panel(button,item('bold','Bold','bold')+item('italic','Italic','italic')+item('fill','Cell fill','paint')+item('number','Number format','table')+item('align','Alignment','align-left')+item('wrap','Wrap text','wrap'));}else if(action==='filter'){panel(button,item('filter-all','All categories','filter')+['Research','Design','Build','Quality','Running costs'].map(x=>`<button data-category="${x}">${x}</button>`).join(''));}else if(action==='filter-all'){filter='';render();document.querySelector('#menu').hidden=true;}else if(action==='sort'){const rows=Array.from({length:5},(_,i)=>cols.map(c=>data.Budget[c+(i+2)]??''));rows.sort((a,b)=>a[0].localeCompare(b[0]));rows.forEach((row,i)=>cols.forEach((c,j)=>data.Budget[c+(i+2)]=c==='D'?`=B${i+2}*C${i+2}`:row[j]));render();hint('Sorted the item rows A–Z.');}else if(action==='freeze'){hint('First row and first column are frozen in this sketch.');}else if(action==='bookmark'){button.classList.toggle('active');button.setAttribute('aria-pressed',String(button.classList.contains('active')));}else if(action==='commit-formula'){set(selected,formula.value);formula.blur();}else if(action==='cancel-edit'){formula.value=data[sheet][selected]??'';formula.blur();}else if(action==='export'){const rows=Array.from({length:11},(_,i)=>cols.slice(0,6).map(c=>'"'+String(value(c+(i+1))).replaceAll('"','""')+'"').join(','));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\r\n')],{type:'text/csv'}));a.download=sheet+'.csv';a.click();URL.revokeObjectURL(a.href);}else if(action==='import'){hint('CSV import will include delimiter, header and column previews in the implementation.');}else if(action==='add-sheet'){hint('Worksheet tabs are a proposed part of the design.');}else if(action==='history'){hint('History will reuse the existing document version tools.');}else if(action==='range'){formula.focus();formula.select();}else if(action==='search'){panel(button,'<small>Find in this table</small><input id="find" aria-label="Find in table" placeholder="Find a value…" style="height:44px;padding:0 10px;width:100%">');document.querySelector('#find').focus();document.querySelector('#find').addEventListener('input',e=>{const match=Object.keys(data[sheet]).find(a=>String(display(a)).toLowerCase().includes(e.target.value.toLowerCase()));if(match){select(match);document.querySelector(`[data-cell="${match}"]`).scrollIntoView({block:'nearest',inline:'nearest'});}});}else if(action==='number'){panel(button,['Automatic','Number','Currency','Percent','Date'].map(x=>`<button data-number="${x}">${x}</button>`).join(''));}else if(action==='rename'){hint('Rename stays in Document tools, shared with normal documents.');}else{hint('This action is shown for design review.');}});
document.addEventListener('dblclick',e=>{const cell=e.target.closest('[data-cell]');if(cell)edit(cell);});
document.querySelector('tbody').addEventListener('focusout',()=>{if(editing)finish();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){finish(false);formula.blur();document.querySelector('#menu').hidden=true;document.querySelector('#files').hidden=true;document.querySelector('#backdrop').hidden=true;return;}if(e.target===formula){if(e.key==='Enter'){e.preventDefault();set(selected,formula.value);formula.blur();}return;}if(editing){if(e.key==='Enter'){e.preventDefault();finish();}return;}if(e.target.matches('[data-cell]')){const c=selected.charCodeAt(0)-65,r=Number(selected.slice(1));const next={ArrowDown:[c,r+1],ArrowUp:[c,r-1],ArrowLeft:[c-1,r],ArrowRight:[c+1,r],Tab:[c+(e.shiftKey?-1:1),r],Enter:[c,r+1]}[e.key];if(next){e.preventDefault();const a=String.fromCharCode(65+Math.max(0,Math.min(13,next[0])))+Math.max(1,Math.min(60,next[1]));select(a,true);document.querySelector(`[data-cell="${a}"]`).scrollIntoView({block:'nearest',inline:'nearest'});}else if(e.key==='F2'){e.preventDefault();edit(e.target);}else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){edit(e.target);e.target.textContent=e.key;e.preventDefault();}}});
document.addEventListener('click',e=>{const tab=e.target.closest('[data-sheet]');if(tab){finish();sheet=tab.dataset.sheet;selected=sheet==='Budget'?'D4':'B2';document.querySelectorAll('[data-sheet]').forEach(el=>el.classList.toggle('active',el===tab));render();}if(e.target.dataset.category){filter=e.target.dataset.category;render();document.querySelector('#menu').hidden=true;}if(e.target.dataset.number){const cell=document.querySelector(`[data-cell="${selected}"]`),number=Number(value(selected));if(Number.isFinite(number))cell.textContent=e.target.dataset.number==='Currency'?money(number):e.target.dataset.number==='Percent'?new Intl.NumberFormat('en-GB',{style:'percent'}).format(number):String(number);document.querySelector('.number-format>span').textContent=e.target.dataset.number;document.querySelector('#menu').hidden=true;}});
document.querySelector('#backdrop').addEventListener('click',()=>document.querySelector('[data-action="close-files"]').click());
if(matchMedia('(max-width:600px)').matches)selected='A2';
if(new URLSearchParams(location.search).get('theme')==='dark')document.documentElement.dataset.theme='dark';icons();render();
</script>
